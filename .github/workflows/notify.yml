name: Notify Maintainer

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify on new issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.issue.number;
            const author = context.payload.issue.user.login;
            const message = `🎉 Thank you @${author} for submitting an issue to **VentoyDocker**!\nYour feedback helps us improve.\nIf you find this project useful, please consider giving it a ⭐️ to show your support!\n\n@Mr-Sunglasses A new issue has been opened: #${issueNumber}. Please take a look!`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: message
            });

      - name: Notify on new PR
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login;
            const message = `🙏🏻 Thank you @${author} for contributing a pull request to **VentoyDocker**!\nWe appreciate your time and effort to make this project better.\nIf you haven't already, consider starring ⭐️ the repository to stay connected.\n\n@Mr-Sunglasses A new pull request has been opened: #${prNumber}. Please take a look!`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: message
            });